<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SysMon</title>
<script>window.NILIX_TOKEN = "/*__NILIX_TOKEN__*/"; try { if (window.NILIX_TOKEN.length > 8) localStorage.setItem("nilix_token", window.NILIX_TOKEN); } catch (e) {}</script>
<link rel="stylesheet" href="css/app.css?v=202608282100">
</head>
<body class="island-collapsed hw-off">
  <div id="card" class="card">

    <!-- 灵动岛收起态:顶部居中透明胶囊(悬停展开) -->
    <div id="pill" class="pill" title="悬停展开">
      <span class="pill-item" id="pi-cpu"><b>C</b><em id="pill-cpu" class="mono">--%</em></span>
      <span class="pill-sep">|</span>
      <span class="pill-item" id="pi-mem"><b>M</b><em id="pill-mem" class="mono">--%</em></span>
      <span class="pill-sep">|</span>
      <span class="pill-item" id="pi-gpu"><b>G</b><em id="pill-gpu" class="mono">--%</em></span>
      <span class="pill-clock mono" id="pill-clock">--:--</span>
      <div class="ambient top" title="实时"></div>
      <div class="ambient-row bottom" title="实时">
        <div class="ambient"></div>
        <div class="ambient"></div>
      </div>
    </div>

    <!-- 灵动岛展开态:完整监测面板(Harness 主题) -->
    <div id="full" class="full">
      <div class="ambient-row" title="实时">
        <div class="ambient"></div>
        <div class="ambient"></div>
      </div>
      <header id="dragbar" class="dragbar">
        <img class="zmark zmark-img" src="icon.png" alt="NiliX">
        <div class="btitle">实时状态<span class="btag">LIVE</span></div>
        <span id="status-dot" class="status-dot" title="实时"></span>
        <button id="settings-btn" class="theme-btn" title="设置">⚙</button>
        <button id="btn-collapse" class="btn-close" title="收起">▾</button>
        <button id="btn-close" class="btn-close" title="关闭">✕</button>
      </header>

      <!-- 设置面板:配色 / KB 显示 / 特效 -->
      <div id="settings-panel" class="settings-panel hidden">
        <div class="set-title">设 置</div>
        <div class="set-row">
          <span class="set-lbl">主题配色</span>
          <div class="set-seg">
            <button class="set-btn" data-theme="dark">深色</button>
            <button class="set-btn" data-theme="light">白天</button>
          </div>
        </div>
        <div class="set-row">
          <span class="set-lbl">炫酷特效</span>
          <label class="set-switch"><input type="checkbox" id="set-fx"><span class="tk"></span></label>
        </div>
      </div>

      <div class="rows">
        <div class="row">
          <div class="lbl">CPU</div>
          <div class="bar"><div class="fill" id="cpu-fill"></div></div>
          <div class="val mono" id="cpu-val">--</div>
          <div class="temp mono" id="cpu-temp"></div>
        </div>
        <div class="cores" id="cores"></div>

        <div class="row">
          <div class="lbl">RAM</div>
          <div class="bar"><div class="fill" id="mem-fill"></div></div>
          <div class="val mono" id="mem-val">--</div>
          <div class="temp mono" id="mem-temp"></div>
        </div>
        <div class="sub mono" id="mem-sub"></div>

        <div class="row">
          <div class="lbl">GPU</div>
          <div class="bar"><div class="fill" id="gpu-fill"></div></div>
          <div class="val mono" id="gpu-val">--</div>
          <div class="temp mono" id="gpu-temp"></div>
        </div>
        <div class="sub mono" id="gpu-mem"></div>

        <div class="row">
          <div class="lbl">SSD</div>
          <div class="io">
            <span class="mono r" id="ssd-r">⤓ --</span>
            <span class="mono w" id="ssd-w">⤒ --</span>
          </div>
          <div class="sub mono cap" id="ssd-cap"></div>
        </div>

        <div class="row">
          <div class="lbl">NET</div>
          <div class="io">
            <span class="mono r" id="net-d">↓ --</span>
            <span class="mono w" id="net-u">↑ --</span>
          </div>
          <div class="sub mono cap" id="net-total"></div>
        </div>

        <!-- 分隔装饰条:区分系统指标区(上)与服务状态区(下) -->
        <div class="divider"></div>

        <div class="row" id="zcode-row">
          <div class="lbl">Z_C</div>
          <div class="io">
            <span id="zcode-dot" class="kb-dot"></span>
            <span class="mono kb-txt" id="zcode-txt">检测中…</span>
            <button id="zcode-start" class="kb-start hidden">启动</button>
            <button id="zcode-stop" class="kb-start kb-stop hidden">停止</button>
          </div>
          <div class="sub mono cap" id="zcode-meta"></div>
        </div>

        <div class="row" id="nilix-row">
          <div class="lbl">N_X</div>
          <div class="io">
            <span id="nilix-dot" class="kb-dot"></span>
            <span class="mono kb-txt" id="nilix-txt">检测中…</span>
            <button id="nilix-wb" class="kb-start hidden">工作台</button>
          </div>
          <div class="sub mono cap" id="nilix-meta"></div>
        </div>

        <div class="row" id="bot-row">
          <div class="lbl">BOT</div>
          <div class="io">
            <span id="bot-dot" class="kb-dot"></span>
            <span class="mono kb-txt" id="bot-txt">检测中…</span>
            <button id="bot-restart" class="kb-start hidden">重启</button>
            <button id="bot-stop" class="kb-start kb-stop hidden">停止</button>
          </div>
          <div class="sub mono cap" id="bot-meta"></div>
        </div>

        <div class="row" id="comfy-row">
          <div class="lbl">CUI</div>
          <div class="io">
            <span id="comfy-dot" class="kb-dot"></span>
            <span class="mono kb-txt" id="comfy-txt">检测中…</span>
            <button id="comfy-start" class="kb-start hidden">启动</button>
            <button id="comfy-stop" class="kb-start kb-stop hidden">停止</button>
            <button id="comfy-open" class="kb-start hidden">访问</button>
          </div>
          <div class="sub mono cap" id="comfy-meta"></div>
        </div>

        <!-- 设备控制中心(2026-08-26 定稿排版):数据行与 SSD/NET 同构(lbl+右值),
             操作区单行收尾(模式三选+制冷/超频),与 HUD 整体行风格对齐。
             2026-08-26 用户要求隐藏:CSS 一键开关(.hw-off),恢复=删样式块即可 -->
        <div class="divider hw-ctl-sep"></div>
        <div class="row hw-row">
          <div class="lbl">CTL</div>
          <div class="io hw-io">
            <span class="mono">CPU <b id="hw-cpu">--</b> · <span id="hw-cput">--°</span></span>
            <span class="hw-vsep"></span>
            <span class="mono">GPU <b id="hw-gpu">--</b> · <span id="hw-gput">--°</span></span>
          </div>
          <div class="sub mono cap" id="hw-note"></div>
        </div>
        <div class="hw-ops">
          <div class="hw-modes" id="hw-modes">
            <button class="hw-mode" data-mode="0" title="轻效:低功耗静音">轻效</button>
            <button class="hw-mode" data-mode="1" title="进阶:均衡">进阶</button>
            <button class="hw-mode" data-mode="2" title="巅峰:全性能释放">巅峰</button>
          </div>
          <span class="hw-vsep"></span>
          <label class="set-switch hw-sw" title="风扇全速(快速制冷)"><input type="checkbox" id="hw-cool"><span class="tk"></span><span class="hw-sw-lbl">制冷</span></label>
          <label class="set-switch hw-sw" title="GPU 核心 +200MHz / 显存 +1000MHz(NVAPI,免管理员)"><input type="checkbox" id="hw-oc"><span class="tk"></span><span class="hw-sw-lbl">超频</span></label>
        </div>
      </div>

      <footer class="foot">
        <span id="foot-uptime">运行 --</span>
        <span id="foot-procs"></span>
        <span id="foot-clock" class="clock ts">--</span>
      </footer>
      <div class="ambient bottom" title="实时"></div>
    </div>

  </div>
  <script src="js/app.js?v=202608282100"></script>
</body>
</html>
