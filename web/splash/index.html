<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NiliX</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: transparent;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-app-region: no-drag;
  }
  /* 卡片容器:圆角+深色渐变底,四周留透明边(透明窗口圆角) */
  .splash {
    position: absolute; inset: 10px;
    border-radius: 18px;
    background: radial-gradient(120% 140% at 50% 0%, #16223a 0%, #0d1524 55%, #0b121f 100%);
    border: 1px solid rgba(255, 108, 55, 0.22);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 26px;
    transition: opacity 0.32s ease, transform 0.32s ease;
  }
  .splash.fadeout { opacity: 0; transform: scale(0.97); }
  /* 品牌 */
  .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .logo {
    font-size: 54px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(100deg, #ffb08a 0%, #ff6c37 45%, #ff9d6c 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(255, 108, 55, 0.35));
    animation: breathe 2.2s ease-in-out infinite;
  }
  .tagline {
    font-size: 13px; letter-spacing: 6px; color: #8fa3c0;
    animation: fadeSlide 1.1s ease both;
  }
  /* 加载三点 */
  .dots { display: flex; gap: 10px; }
  .dots i {
    width: 9px; height: 9px; border-radius: 50%;
    background: #ff6c37; opacity: 0.25;
    animation: jump 1.15s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: 0.15s; }
  .dots i:nth-child(3) { animation-delay: 0.3s; }
  /* 进度条 */
  .bar {
    width: 210px; height: 3px; border-radius: 2px;
    background: rgba(255, 255, 255, 0.08); overflow: hidden;
  }
  .bar::after {
    content: ""; display: block; height: 100%; width: 40%;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, #ff6c37, #ffb08a, transparent);
    animation: flow 1.3s linear infinite;
  }
  .status {
    font-size: 11.5px; color: #64748f; letter-spacing: 1px;
    animation: fadeSlide 1.4s ease both;
  }
  @keyframes breathe { 0%, 100% { filter: drop-shadow(0 0 10px rgba(255,108,55,0.22)); } 50% { filter: drop-shadow(0 0 24px rgba(255,108,55,0.5)); } }
  @keyframes jump { 0%, 100% { transform: translateY(0); opacity: 0.25; } 45% { transform: translateY(-9px); opacity: 1; } }
  @keyframes flow { 0% { transform: translateX(-110%); } 100% { transform: translateX(300%); } }
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <div class="splash" id="splash">
    <div class="brand">
      <div class="logo">NiliX</div>
      <div class="tagline">小说转视频工作台</div>
    </div>
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="bar"></div>
    <div class="status" id="status">启动服务中…</div>
  </div>
  <script>
    // 就绪回调(Go 侧 ExecJS 调用):淡出动画后由 Go 关窗
    window.__splashFade = function () {
      document.getElementById("splash").classList.add("fadeout");
    };
    // 兜底:页面自身 12s 未收到指令也标记淡出(窗口由 Go 兜底关)
    setTimeout(function () { window.__splashFade(); }, 12000);
  </script>
</body>
</html>
