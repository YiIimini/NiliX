<!DOCTYPE html>
<html lang="zh-CN" data-theme="nebula">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NiliX</title>
<script>
  // 主题跟随(2026-08-27 用户要求):与主界面/胶囊同源共享 localStorage(kbw-theme),
  // 首帧前同步 data-theme(必须先于渲染执行,防默认主题闪变)
  try {
    document.documentElement.dataset.theme = localStorage.getItem("kbw-theme") || "nebula";
  } catch (e) { /* localStorage 不可用时保持 nebula */ }
</script>
<link rel="stylesheet" href="/css/themes.css?v=202608282100">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: transparent;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-app-region: no-drag;
  }
  /* 兜底变量:主题表未命中(未知主题名/样式表未就绪)时保持 nebula 同款,画面不散架 */
  :root {
    --bg: #070b14; --surface: #0e1524;
    --bg-grad-1: rgba(56, 189, 248, 0.10); --bg-grad-2: rgba(34, 211, 238, 0.05);
    --text: #e6edf7; --muted: #8b98ad;
    --accent: #38bdf8; --accent-2: #22d3ee; --glow: rgba(56, 189, 248, 0.45);
    --panel-border: rgba(148, 183, 255, 0.16); --line: rgba(148, 183, 255, 0.14);
  }
  /* 卡片容器:圆角+主题渐变底(顶部主题色微光+面板→底色纵向渐变),四周留透明边(透明窗口圆角) */
  .splash {
    position: absolute; inset: 10px;
    border-radius: 18px;
    background:
      radial-gradient(120% 140% at 50% 0%, var(--bg-grad-1) 0%, transparent 60%),
      linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
    border: 1px solid var(--panel-border);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 26px;
    transition: opacity 0.32s ease, transform 0.32s ease;
  }
  .splash.fadeout { opacity: 0; transform: scale(0.97); }
  /* 品牌:主色→辅色渐变字 */
  .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .logo {
    font-size: 54px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(100deg, var(--accent-2) 0%, var(--accent) 45%, var(--accent-2) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px var(--glow));
    animation: breathe 2.2s ease-in-out infinite;
  }
  .tagline {
    font-size: 13px; letter-spacing: 6px; color: var(--muted);
    animation: fadeSlide 1.1s ease both;
  }
  /* 加载三点 */
  .dots { display: flex; gap: 10px; }
  .dots i {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); opacity: 0.25;
    animation: jump 1.15s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: 0.15s; }
  .dots i:nth-child(3) { animation-delay: 0.3s; }
  /* 进度条:轨道用主题线色,流光走主/辅色 */
  .bar {
    width: 210px; height: 3px; border-radius: 2px;
    background: var(--line); overflow: hidden;
  }
  .bar::after {
    content: ""; display: block; height: 100%; width: 40%;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--accent-2), var(--accent), transparent);
    animation: flow 1.3s linear infinite;
  }
  .status {
    font-size: 11.5px; color: var(--muted); opacity: 0.85; letter-spacing: 1px;
    animation: fadeSlide 1.4s ease both;
  }
  @keyframes breathe { 0%, 100% { filter: drop-shadow(0 0 10px var(--glow)); } 50% { filter: drop-shadow(0 0 24px var(--glow)); } }
  @keyframes jump { 0%, 100% { transform: translateY(0); opacity: 0.25; } 45% { transform: translateY(-9px); opacity: 1; } }
  @keyframes flow { 0% { transform: translateX(-110%); } 100% { transform: translateX(300%); } }
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <div class="splash" id="splash">
    <div class="brand">
      <div class="logo">NiliX</div>
      <div class="tagline">小说转视频工作台</div>
    </div>
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="bar"></div>
    <div class="status" id="status">启动服务中…</div>
  </div>
  <script>
    // 就绪回调(Go 侧 ExecJS 调用):淡出动画后由 Go 关窗
    window.__splashFade = function () {
      document.getElementById("splash").classList.add("fadeout");
    };
    // 兜底:页面自身 12s 未收到指令也标记淡出(窗口由 Go 兜底关)
    setTimeout(function () { window.__splashFade(); }, 12000);
  </script>
</body>
</html>
